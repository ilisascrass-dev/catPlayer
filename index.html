<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#0f1115">
<title>Аудиоплеер</title>
<style>
  :root {
    --bg: #0b0d12;
    --surface: #14161b;
    --surface-2: #1a1c21;
    --text: #e3e1e9;
    --muted: #90909a;
    --primary: #b8c4ff;
    --on-primary: #1a2a5e;
    --hover: rgba(184, 196, 255, 0.06);
    --pressed: rgba(184, 196, 255, 0.12);
    --radius-xl: 32px;
    --radius-full: 999px;
    --ease: cubic-bezier(0.2, 0, 0, 1);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; align-items: center; justify-content: center;
    min-height: 100dvh; padding: 16px; overflow: hidden; font-size: 14px;
  }

  .player {
    width: 100%; max-width: 460px;
    background: rgba(20, 22, 27, 0.7);
    backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
    border: 1px solid rgba(255,255,255,0.05);
    border-radius: var(--radius-xl);
    padding: 16px; display: flex; flex-direction: column; gap: 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }

  /* ===== Визуализация ===== */
  .viz-wrap {
    position: relative; width: 100%; aspect-ratio: 1;
    border-radius: var(--radius-xl); overflow: hidden;
    background: radial-gradient(circle at 50% 50%, #161823 0%, #07080c 70%);
    display: flex; align-items: center; justify-content: center;
  }
  .blob { position: absolute; border-radius: 50%; filter: blur(60px); opacity: 0.35; z-index: 0; animation: blobFloat 20s ease-in-out infinite; }
  .blob-1 { width: 60%; height: 60%; background: #3b4a8f; top: 10%; left: 5%; }
  .blob-2 { width: 55%; height: 55%; background: #7a3b6e; bottom: 5%; right: 5%; animation-delay: -7s; }
  @keyframes blobFloat {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(10%, -10%) scale(1.2); }
  }

  canvas { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }

  .cover-img {
    position: absolute; width: 60%; height: 60%;
    border-radius: 50%; object-fit: cover;
    box-shadow: 0 0 0 4px rgba(255,255,255,0.08), 0 0 40px rgba(184,196,255,0.2);
    transition: opacity .4s var(--ease); z-index: 3;
    animation: spin 24s linear infinite; animation-play-state: paused;
  }
  .cover-img.playing { animation-play-state: running; }
  .cover-img.hidden { opacity: 0; }

  .cover-placeholder {
    position: absolute; width: 60%; height: 60%; border-radius: 50%;
    background: repeating-radial-gradient(circle at 50% 50%, #2a2c38 0px, #2a2c38 2px, #1c1d26 3px, #1c1d26 6px);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 0 4px rgba(255,255,255,0.05), inset 0 0 30px rgba(0,0,0,0.8);
    transition: opacity .4s var(--ease); z-index: 3;
    animation: spin 24s linear infinite; animation-play-state: paused;
  }
  .cover-placeholder.playing { animation-play-state: running; }
  .cover-placeholder.hidden { opacity: 0; }

  .vinyl-hole {
    position: absolute; width: 8%; height: 8%; border-radius: 50%;
    background: var(--bg); box-shadow: inset 0 0 10px rgba(0,0,0,1), 0 0 0 1px rgba(255,255,255,0.1);
    z-index: 4; transition: opacity .4s;
  }
  .vinyl-hole.hidden { opacity: 0; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  .empty-screen {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px;
    color: var(--muted); font-size: 13px; text-align: center;
    pointer-events: none; transition: opacity .4s var(--ease); z-index: 5;
  }
  .empty-screen.hidden { opacity: 0; }
  .empty-screen .icon {
    width: 72px; height: 72px; display: flex; align-items: center; justify-content: center;
    border-radius: 50%; background: rgba(255,255,255,0.03); font-size: 32px;
  }

  /* ===== Инфо ===== */
  .track-info { display: flex; flex-direction: column; gap: 4px; text-align: center; }
  .track-title { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .track-sub { font-size: 14px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ===== Прогресс ===== */
  .progress-bar { width: 100%; height: 20px; display: flex; align-items: center; cursor: pointer; }
  .progress-track { width: 100%; height: 4px; background: rgba(255,255,255,0.08); border-radius: var(--radius-full); overflow: hidden; transition: height .2s var(--ease); }
  .progress-bar:hover .progress-track { height: 6px; }
  .progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #b8c4ff, #e0bbdd); border-radius: var(--radius-full); transition: width .1s linear; }
  .time-row { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; margin-top: 4px; }

  /* ===== Кнопки ===== */
  .controls { display: flex; align-items: center; justify-content: center; gap: 16px; }
  .ctrl-btn {
    background: transparent; border: none; color: var(--text);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    border-radius: 50%; width: 48px; height: 48px; font-size: 20px;
    transition: background .2s, transform .15s; position: relative; overflow: hidden;
  }
  .ctrl-btn:hover { background: var(--hover); color: var(--primary); }
  .ctrl-btn:active { background: var(--pressed); transform: scale(.9); }

  .ctrl-btn.play {
    width: 72px; height: 72px; font-size: 32px;
    background: linear-gradient(135deg, #b8c4ff, #9aa9ff); color: var(--on-primary);
    box-shadow: 0 4px 20px rgba(184,196,255,0.4);
    transition: transform .15s var(--ease), box-shadow .2s;
  }
  .ctrl-btn.play:active { transform: scale(.92); box-shadow: 0 2px 10px rgba(184,196,255,0.3); }

  .ripple { position: absolute; border-radius: 50%; background: currentColor; opacity: 0.25; transform: scale(0); animation: rippleAnim .6s var(--ease); pointer-events: none; }
  @keyframes rippleAnim { to { transform: scale(2.5); opacity: 0; } }

  /* ===== Громкость ===== */
  .volume-row { display: flex; align-items: center; gap: 12px; color: var(--muted); }
  input[type=range] { flex: 1; -webkit-appearance: none; appearance: none; height: 4px; background: rgba(255,255,255,0.08); border-radius: var(--radius-full); outline: none; cursor: pointer; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: var(--primary); cursor: pointer; border: none; }
  input[type=range]::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: var(--primary); border: none; cursor: pointer; }
  #volLabel { font-size: 12px; min-width: 36px; text-align: right; font-variant-numeric: tabular-nums; }

  /* ===== Загрузка ===== */
  .upload-btn {
    height: 48px; border-radius: var(--radius-full);
    background: #434659; color: #e0e1f9; border: none;
    font-size: 14px; font-weight: 500; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: background .2s, transform .1s; position: relative; overflow: hidden;
  }
  .upload-btn:hover { background: #4d5064; }
  .upload-btn:active { transform: scale(.97); }
  #fileInput { display: none; }

  /* ===== Плейлист ===== */
  .playlist { max-height: 180px; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
  .playlist::-webkit-scrollbar { width: 4px; }
  .playlist::-webkit-scrollbar-thumb { background: #45464f; border-radius: 2px; }
  .playlist-empty { font-size: 13px; color: var(--muted); text-align: center; padding: 12px; }
  .track-item {
    display: flex; align-items: center; gap: 12px; padding: 8px 10px;
    border-radius: 18px; font-size: 14px; cursor: pointer;
    transition: background .2s var(--ease);
  }
  .track-item:hover { background: var(--hover); }
  .track-item.active { background: rgba(184,196,255,0.1); color: var(--primary); }
  .track-item img { width: 44px; height: 44px; border-radius: 12px; object-fit: cover; background: var(--surface-2); flex-shrink: 0; }
  .track-item .mini-placeholder { width: 44px; height: 44px; border-radius: 12px; background: var(--surface-2); display: flex; align-items: center; justify-content: center; font-size: 18px; color: var(--muted); flex-shrink: 0; }
  .track-item .meta { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .track-item .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
  .track-item .artist { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .track-item.active .artist { color: var(--primary); opacity: .7; }
  .track-item .rm { background: transparent; border: none; color: var(--muted); cursor: pointer; font-size: 18px; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: background .15s; flex-shrink: 0; }
  .track-item .rm:hover { background: var(--pressed); color: #ffb4ab; }

  .hint { font-size: 11px; color: var(--muted); text-align: center; }

  @media (max-width: 420px) {
    body { padding: 8px; }
    .player { padding: 12px; gap: 12px; border-radius: 28px; }
    .track-title { font-size: 20px; }
    .ctrl-btn.play { width: 64px; height: 64px; font-size: 26px; }
    .ctrl-btn { width: 44px; height: 44px; }
  }
</style>
</head>
<body>

<div class="player">
  <div class="viz-wrap">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <canvas id="viz"></canvas>
    <div class="empty-screen" id="emptyScreen">
      <div class="icon">🎵</div>
      <div>Загрузи mp3 — и погнали</div>
    </div>
    <img class="cover-img hidden" id="coverImg" alt="">
    <div class="cover-placeholder hidden" id="coverPlaceholder"></div>
    <div class="vinyl-hole hidden" id="vinylHole"></div>
  </div>

  <div class="track-info">
    <div class="track-title" id="title">Ничего не выбрано</div>
    <div class="track-sub" id="sub">Загрузи файл или перетащи</div>
  </div>

  <div>
    <div class="progress-bar" id="progressBar">
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <div class="time-row">
      <span id="curTime">0:00</span>
      <span id="durTime">0:00</span>
    </div>
  </div>

  <div class="controls">
    <button class="ctrl-btn" onclick="prevTrack()" title="Предыдущий">⏮</button>
    <button class="ctrl-btn play" id="playBtn" onclick="togglePlay()">▶</button>
    <button class="ctrl-btn" onclick="nextTrack()" title="Следующий">⏭</button>
  </div>

  <div class="volume-row">
    <span>🔈</span>
    <input type="range" id="volume" min="0" max="1" step="0.01" value="1">
    <span id="volLabel">100%</span>
  </div>

  <label class="upload-btn" for="fileInput">
    <span style="font-size:18px;">＋</span> Загрузить mp3
  </label>
  <input type="file" id="fileInput" accept="audio/*" multiple>

  <div class="playlist" id="playlist">
    <div class="playlist-empty">Плейлист пуст</div>
  </div>

  <div class="hint">Если в mp3 встроена обложка — покажется и закрутится</div>
</div>

<audio id="audio"></audio>

<script>
const audio = document.getElementById('audio');
const playBtn = document.getElementById('playBtn');
const titleEl = document.getElementById('title');
const subEl = document.getElementById('sub');
const curTime = document.getElementById('curTime');
const durTime = document.getElementById('durTime');
const progressBar = document.getElementById('progressBar');
const progressFill = document.getElementById('progressFill');
const volumeEl = document.getElementById('volume');
const volLabel = document.getElementById('volLabel');
const playlistEl = document.getElementById('playlist');
const fileInput = document.getElementById('fileInput');
const canvas = document.getElementById('viz');
const ctx = canvas.getContext('2d');
const coverImg = document.getElementById('coverImg');
const coverPlaceholder = document.getElementById('coverPlaceholder');
const vinylHole = document.getElementById('vinylHole');
const emptyScreen = document.getElementById('emptyScreen');

let tracks = [];
let currentIndex = -1;
let audioCtx, analyser, source, dataArray;
let vizActive = false;
let particles = [];

/* ===== Ripple ===== */
document.querySelectorAll('.ctrl-btn, .upload-btn').forEach(btn => {
  btn.addEventListener('pointerdown', e => {
    const rect = btn.getBoundingClientRect();
    const size = Math.max(rect.width, rect.height);
    const r = document.createElement('span');
    r.className = 'ripple';
    r.style.width = r.style.height = size + 'px';
    r.style.left = (e.clientX - rect.left - size/2) + 'px';
    r.style.top  = (e.clientY - rect.top  - size/2) + 'px';
    btn.appendChild(r);
    setTimeout(() => r.remove(), 600);
  });
});

/* ===== ID3 ===== */
async function parseID3(file) {
  const result = { coverUrl: null, artist: null, title: null };
  try {
    const buf = await file.slice(0, 3 * 1024 * 1024).arrayBuffer();
    const bytes = new Uint8Array(buf);
    if (bytes.length < 10) return result;
    if (bytes[0] !== 0x49 || bytes[1] !== 0x44 || bytes[2] !== 0x33) return result;
    const version = bytes[3];
    const flags = bytes[5];
    const tagSize = (bytes[6] << 21) | (bytes[7] << 14) | (bytes[8] << 7) | bytes[9];
    const tagEnd = Math.min(10 + tagSize, bytes.length);
    let offset = 10;
    if (flags & 0x40) {
      const extSize = version === 4
        ? ((bytes[offset] << 21) | (bytes[offset+1] << 14) | (bytes[offset+2] << 7) | bytes[offset+3])
        : ((bytes[offset] << 24) | (bytes[offset+1] << 16) | (bytes[offset+2] << 8) | bytes[offset+3]) + 4;
      offset += extSize;
    }
    while (offset < tagEnd - 10) {
      let frameId, frameSize;
      if (version === 3) {
        frameId = String.fromCharCode(bytes[offset], bytes[offset+1], bytes[offset+2], bytes[offset+3]);
        frameSize = (bytes[offset+4] << 24) | (bytes[offset+5] << 16) | (bytes[offset+6] << 8) | bytes[offset+7];
        offset += 10;
      } else if (version === 4) {
        frameId = String.fromCharCode(bytes[offset], bytes[offset+1], bytes[offset+2], bytes[offset+3]);
        frameSize = (bytes[offset+4] << 21) | (bytes[offset+5] << 14) | (bytes[offset+6] << 7) | bytes[offset+7];
        offset += 10;
      } else return result;
      if (frameSize <= 0 || offset + frameSize > bytes.length) break;
      if (!/^[A-Z0-9]{4}$/.test(frameId)) break;
      const frame = bytes.slice(offset, offset + frameSize);
      if (frameId === 'APIC') {
        const enc = frame[0];
        let p = 1;
        let mime = '';
        while (p < frame.length && frame[p] !== 0) { mime += String.fromCharCode(frame[p]); p++; }
        p++; p++;
        if (enc === 1 || enc === 2) {
          while (p + 1 < frame.length && !(frame[p] === 0 && frame[p+1] === 0)) p += 2;
          p += 2;
        } else {
          while (p < frame.length && frame[p] !== 0) p++;
          p++;
        }
        const imgData = frame.slice(p);
        if (imgData.length > 100) {
          const blob = new Blob([imgData], { type: mime || 'image/jpeg' });
          result.coverUrl = URL.createObjectURL(blob);
        }
      }
      if (frameId === 'TPE1') result.artist = decodeTextFrame(frame);
      if (frameId === 'TIT2') result.title = decodeTextFrame(frame);
      offset += frameSize;
    }
  } catch (e) {}
  return result;
}

function decodeTextFrame(frame) {
  if (frame.length < 2) return null;
  const enc = frame[0], data = frame.slice(1);
  try {
    if (enc === 0) return new TextDecoder('iso-8859-1').decode(data).replace(/\0+$/, '').trim();
    if (enc === 3) return new TextDecoder('utf-8').decode(data).replace(/\0+$/, '').trim();
    if (enc === 1 || enc === 2) return new TextDecoder('utf-16').decode(data).replace(/\0+$/, '').trim();
  } catch (e) {}
  return null;
}

/* ===== Визуализация ===== */
function setupAudioContext() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 512;
  analyser.smoothingTimeConstant = 0.8;
  dataArray = new Uint8Array(analyser.frequencyBinCount);
  source = audioCtx.createMediaElementSource(audio);
  source.connect(analyser);
  analyser.connect(audioCtx.destination);
}

function resizeCanvas() {
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

function drawViz() {
  if (!vizActive) return;
  requestAnimationFrame(drawViz);
  const rect = canvas.getBoundingClientRect();
  const W = rect.width, H = rect.height;
  ctx.clearRect(0, 0, W, H);
  if (!analyser) return;
  analyser.getByteFrequencyData(dataArray);

  const cx = W / 2, cy = H / 2;
  const minDim = Math.min(W, H);
  const baseRadius = minDim * 0.32;
  const maxBar = minDim * 0.18;

  let totalVol = 0;
  for (let i = 0; i < dataArray.length; i++) totalVol += dataArray[i];
  const avgVol = totalVol / dataArray.length;

  const bars = 90;
  const step = Math.floor(dataArray.length / bars);
  ctx.lineCap = 'round';

  for (let i = 0; i < bars; i++) {
    let sum = 0;
    for (let j = 0; j < step; j++) sum += dataArray[i * step + j];
    const avg = sum / step;
    const normalized = avg / 255;
    const len = Math.max(4, normalized * maxBar);
    const angle = (i / bars) * Math.PI * 2 - Math.PI / 2;
    const waveOffset = Math.sin(Date.now() / 800 + i * 0.2) * 3;
    const rStart = baseRadius + waveOffset;
    const rEnd = baseRadius + len;
    const x1 = cx + Math.cos(angle) * rStart;
    const y1 = cy + Math.sin(angle) * rStart;
    const x2 = cx + Math.cos(angle) * rEnd;
    const y2 = cy + Math.sin(angle) * rEnd;
    const hue = 230 + Math.sin(i / bars * Math.PI * 2) * 40;
    const sat = 70 + normalized * 20;
    const light = 60 + normalized * 30;
    ctx.strokeStyle = `hsla(${hue}, ${sat}%, ${light}%, ${0.4 + normalized * 0.6})`;
    ctx.lineWidth = 3 + normalized * 3;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
  }

  const bassAvg = (dataArray[1] + dataArray[2] + dataArray[3]) / 3;
  const bassNorm = bassAvg / 255;
  ctx.beginPath();
  ctx.arc(cx, cy, baseRadius - 8, 0, Math.PI * 2);
  ctx.strokeStyle = `rgba(184, 196, 255, ${0.1 + bassNorm * 0.3})`;
  ctx.lineWidth = 1 + bassNorm * 4;
  ctx.stroke();

  if (bassNorm > 0.6 && Math.random() < 0.3) {
    const angle = Math.random() * Math.PI * 2;
    particles.push({
      x: cx + Math.cos(angle) * baseRadius,
      y: cy + Math.sin(angle) * baseRadius,
      vx: Math.cos(angle) * (1 + Math.random() * 2),
      vy: Math.sin(angle) * (1 + Math.random() * 2),
      life: 1, size: 1 + Math.random() * 2, hue: 230 + Math.random() * 50
    });
  }
  for (let p of particles) {
    p.x += p.vx; p.y += p.vy; p.life -= 0.015;
    if (p.life > 0) {
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${p.hue}, 80%, 70%, ${p.life})`;
      ctx.fill();
    }
  }
  particles = particles.filter(p => p.life > 0);
}

/* ===== Плейлист ===== */
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderPlaylist() {
  if (!tracks.length) {
    playlistEl.innerHTML = '<div class="playlist-empty">Плейлист пуст</div>';
    return;
  }
  playlistEl.innerHTML = '';
  tracks.forEach((t, i) => {
    const div = document.createElement('div');
    div.className = 'track-item' + (i === currentIndex ? ' active' : '');
    const coverHtml = t.coverUrl ? `<img src="${t.coverUrl}" alt="">` : `<div class="mini-placeholder">🎵</div>`;
    div.innerHTML = `
      ${coverHtml}
      <div class="meta">
        <div class="name">${escapeHtml(t.title || t.name)}</div>
        <div class="artist">${escapeHtml(t.artist || 'Неизвестный исполнитель')}</div>
      </div>
      <button class="rm" title="Удалить">×</button>
    `;
    div.onclick = e => {
      if (e.target.classList.contains('rm')) { removeTrack(i); return; }
      playTrack(i);
    };
    playlistEl.appendChild(div);
  });
}

async function addFiles(files) {
  for (const f of files) {
    if (!f.type.startsWith('audio/')) continue;
    const baseName = f.name.replace(/\.[^.]+$/, '');
    const meta = await parseID3(f);
    tracks.push({
      name: baseName, title: meta.title || baseName,
      artist: meta.artist || null, coverUrl: meta.coverUrl,
      url: URL.createObjectURL(f)
    });
  }
  renderPlaylist();
  if (currentIndex === -1 && tracks.length) playTrack(0);
}

function removeTrack(i) {
  URL.revokeObjectURL(tracks[i].url);
  if (tracks[i].coverUrl) URL.revokeObjectURL(tracks[i].coverUrl);
  tracks.splice(i, 1);
  if (i === currentIndex) {
    audio.pause(); vizActive = false; currentIndex = -1;
    audio.removeAttribute('src');
    titleEl.textContent = 'Ничего не выбрано';
    subEl.textContent = 'Загрузи файл или перетащи';
    progressFill.style.width = '0%';
    curTime.textContent = '0:00';
    durTime.textContent = '0:00';
    coverImg.classList.add('hidden');
    coverPlaceholder.classList.add('hidden');
    vinylHole.classList.add('hidden');
    emptyScreen.classList.remove('hidden');
    playBtn.textContent = '▶';
  } else if (i < currentIndex) currentIndex--;
  renderPlaylist();
}

/* ===== Плеер ===== */
function playTrack(i) {
  if (i < 0 || i >= tracks.length) return;
  currentIndex = i;
  const t = tracks[i];
  audio.pause();
  audio.src = t.url;
  audio.load();
  setupAudioContext();
  if (audioCtx.state === 'suspended') audioCtx.resume();

  emptyScreen.classList.add('hidden');
  if (t.coverUrl) {
    coverImg.src = t.coverUrl;
    coverImg.classList.remove('hidden');
    coverPlaceholder.classList.add('hidden');
  } else {
    coverImg.classList.add('hidden');
    coverPlaceholder.classList.remove('hidden');
  }
  vinylHole.classList.remove('hidden');

  audio.play().then(() => {
    vizActive = true;
    drawViz();
    coverImg.classList.add('playing');
    coverPlaceholder.classList.add('playing');
    playBtn.textContent = '⏸';
  }).catch(err => { playBtn.textContent = '▶'; });

  titleEl.textContent = t.title || t.name;
  subEl.textContent = t.artist || 'Неизвестный исполнитель';
  renderPlaylist();
}

function togglePlay() {
  if (!tracks.length) { fileInput.click(); return; }
  if (currentIndex === -1) { playTrack(0); return; }
  if (audio.paused) {
    setupAudioContext();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    audio.play();
    vizActive = true;
    drawViz();
    coverImg.classList.add('playing');
    coverPlaceholder.classList.add('playing');
    playBtn.textContent = '⏸';
  } else {
    audio.pause();
    coverImg.classList.remove('playing');
    coverPlaceholder.classList.remove('playing');
    playBtn.textContent = '▶';
  }
}

function nextTrack() { if (tracks.length) playTrack((currentIndex + 1) % tracks.length); }
function prevTrack() { if (tracks.length) playTrack((currentIndex - 1 + tracks.length) % tracks.length); }

/* ===== Время ===== */
function fmt(sec) {
  if (!isFinite(sec)) return '0:00';
  const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
  return m + ':' + (s < 10 ? '0' : '') + s;
}

audio.addEventListener('timeupdate', () => {
  if (!audio.duration) return;
  const pct = (audio.currentTime / audio.duration) * 100;
  progressFill.style.width = pct + '%';
  curTime.textContent = fmt(audio.currentTime);
  durTime.textContent = fmt(audio.duration);
});
audio.addEventListener('ended', () => nextTrack());
audio.addEventListener('play', () => { playBtn.textContent = '⏸'; });
audio.addEventListener('pause', () => { playBtn.textContent = '▶'; });

progressBar.addEventListener('click', e => {
  if (!audio.duration) return;
  const rect = progressBar.getBoundingClientRect();
  const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
  audio.currentTime = pct * audio.duration;
});

/* ===== Громкость ===== */
volumeEl.addEventListener('input', () => {
  audio.volume = volumeEl.value;
  volLabel.textContent = Math.round(volumeEl.value * 100) + '%';
});
audio.volume = 1;

/* ===== Загрузка ===== */
fileInput.addEventListener('change', e => addFiles(e.target.files));
document.body.addEventListener('dragover', e => e.preventDefault());
document.body.addEventListener('drop', e => {
  e.preventDefault();
  if (e.dataTransfer.files.length) addFiles(e.dataTransfer.files);
});

/* ===== Клавиатура ===== */
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  if (e.code === 'ArrowRight') audio.currentTime = Math.min(audio.currentTime + 5, audio.duration || 0);
  if (e.code === 'ArrowLeft')  audio.currentTime = Math.max(audio.currentTime - 5, 0);
  if (e.code === 'ArrowUp')   { e.preventDefault(); volumeEl.value = Math.min(1, +volumeEl.value + 0.05); audio.volume = volumeEl.value; volLabel.textContent = Math.round(volumeEl.value*100)+'%'; }
  if (e.code === 'ArrowDown') { e.preventDefault(); volumeEl.value = Math.max(0, +volumeEl.value - 0.05); audio.volume = volumeEl.value; volLabel.textContent = Math.round(volumeEl.value*100)+'%'; }
});

renderPlaylist();
</script>
</body>
</html>
